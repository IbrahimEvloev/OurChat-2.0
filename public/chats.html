<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurChat — Чаты</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OurChat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --mine: #4A4A52;
    --theirs: #5C5C66;
    --ink: #232228;
    --muted: #8E88A8;
    --danger: #B5504A;
    --online: #3FA66B;
    --soft: #F1F0EE;
  }
  body{ font-family: 'Manrope', sans-serif; color: var(--ink); }
  .wordmark{ font-family: 'Fraunces', serif; font-weight: 700; letter-spacing: -0.02em; }

  #listHeader{
    background: rgba(255,255,255,0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    padding-top: env(safe-area-inset-top);
  }

  .dotted{
    background-color: #F6F5F3;
    background-image: radial-gradient(rgba(120,110,130,0.16) 1.2px, transparent 1.2px);
    background-size: 18px 18px;
  }

  .search-field{
    background: var(--soft);
    border: 1px solid transparent;
    color: var(--ink);
    transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .search-field::placeholder{ color: var(--muted); }
  .search-field:focus{
    outline: none;
    background: #fff;
    border-color: rgba(74,74,82,0.35);
    box-shadow: 0 0 0 3px rgba(74,74,82,0.12);
  }
  .icon-btn{
    color: var(--mine);
    transition: background-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover{ background: var(--soft); }
  .icon-btn:focus-visible, .chat-row:focus-visible{ outline: 2px solid var(--mine); outline-offset: -2px; }

  .chat-row{
    position: relative;
    background: #fff;
    transition: background-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .chat-row::after{
    content: "";
    position: absolute;
    left: 76px; right: 0; bottom: 0;
    height: 1px;
    background: #EFEEEC;
  }
  .chat-row:last-child::after{ display: none; }
  .chat-row:hover{ background: #F8F7F6; }
  .chat-row:active{ background: #EFEEEC; }

  .unread-dot{
    min-width: 10px; height: 10px;
    border-radius: 9999px;
    background: var(--mine);
  }

  .row-in{ animation: rowIn .24s ease-out both; }
  @keyframes rowIn{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce){
    .row-in{ animation: none; }
    .animate-pulse{ animation: none; }
  }
</style>
</head>
<body class="h-[100dvh] bg-gray-100 flex justify-center items-center overflow-hidden">

<div class="max-w-md w-full h-full bg-white flex flex-col">

  <div id="listHeader" class="sticky top-0 z-10 border-b">
    <div class="flex items-center gap-3 px-4 pt-3 pb-2">
      <h1 class="wordmark text-2xl leading-none">OurChat</h1>
      <div class="ml-auto flex items-center gap-1">
        <div class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full" style="background:var(--soft)">
          <div id="myAvatar" class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px] font-semibold flex-shrink-0"></div>
          <span id="myName" class="text-xs font-semibold truncate max-w-[88px]"></span>
        </div>
        <button id="logoutBtn" type="button" aria-label="Выйти" title="Выйти" class="icon-btn w-9 h-9 rounded-full flex items-center justify-center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>

    <div class="px-3 pb-3 relative">
      <svg class="absolute left-6 top-[13px] pointer-events-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Найти собеседника" autocomplete="off" autocapitalize="off" spellcheck="false" class="search-field w-full rounded-full pl-10 pr-10 py-2.5 text-sm">
      <button id="searchClear" type="button" aria-label="Очистить" class="hidden absolute right-5 top-[9px] w-6 h-6 rounded-full items-center justify-center text-white text-xs" style="background:var(--muted)">✕</button>
    </div>
  </div>

  <div id="searchResult" class="hidden flex-1 min-h-0 overflow-y-auto"></div>
  <div id="chatList" class="flex-1 min-h-0 overflow-y-auto"></div>
</div>

<div id="logoutModal" class="fixed inset-0 z-30 hidden items-center justify-center px-6" style="background:rgba(35,34,40,0.35); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);">
  <div class="bg-white rounded-3xl p-6 w-full max-w-[320px] shadow-xl">
    <h2 class="wordmark text-xl mb-1">Выйти из аккаунта?</h2>
    <p class="text-sm mb-5" style="color:var(--muted)">Чтобы вернуться в чаты, нужно будет снова войти.</p>
    <div class="flex gap-2">
      <button id="cancelLogout" type="button" class="flex-1 py-2.5 rounded-xl text-sm font-semibold" style="background:var(--soft); color:var(--ink)">Отмена</button>
      <button id="confirmLogout" type="button" class="flex-1 py-2.5 rounded-xl text-sm font-semibold text-white" style="background:var(--danger)">Выйти</button>
    </div>
  </div>
</div>

<script src="chats.js"></script>
</body>
</html>
