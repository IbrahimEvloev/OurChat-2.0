<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurChat — Чат</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OurChat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
--mine: #4A4A52;
--theirs: #5C5C66;
--ink: #232228;
--muted: #8E88A8;
--danger: #B5504A;
}
body{ font-family: 'Manrope', sans-serif; color: var(--ink); }
.wordmark{ font-family: 'Fraunces', serif; font-weight: 700; letter-spacing: -0.02em; }
.accent-bg{ background: var(--mine); }
.accent-text{ color: var(--mine); }
.accent-border{ border-color: var(--mine); }
#messagesWrapper{
background-color: #F6F5F3;
background-image: radial-gradient(rgba(120,110,130,0.16) 1.2px, transparent 1.2px);
background-size: 18px 18px;
}
#chatHeader{
background: rgba(255,255,255,0.82);
-webkit-backdrop-filter: blur(14px);
backdrop-filter: blur(14px);
}
.day-chip{
font-size: 11px;
font-weight: 600;
color: var(--muted);
background: rgba(255,255,255,0.85);
border: 1px solid rgba(140,120,180,0.15);
padding: 3px 12px;
border-radius: 999px;
}
.msg-in{ animation: msgIn 0.22s ease-out; }
@keyframes msgIn{
from{ opacity: 0; transform: translateY(8px) scale(0.98); }
to{ opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce){ .msg-in{ animation: none; } }
#recordDot{ animation: recordPulse 1s ease-in-out infinite; }
@keyframes recordPulse{ 0%,100%{ opacity: 1; } 50%{ opacity: 0.25; } }
</style>
</head>
<body class="h-[100dvh] bg-gray-100 flex justify-center items-center overflow-hidden">

<div class="max-w-md w-full h-full bg-white flex flex-col">
<div id="chatHeader" class="sticky top-0 z-10 bg-white p-3 border-b flex items-center gap-2">
<button id="backBtn" class="accent-text leading-none px-1 flex items-center justify-center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div id="chatAvatar" class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0" style="background:var(--mine)"></div>
<div class="flex flex-col leading-tight">
<span id="chatTitle" class="text-lg font-semibold wordmark">Чат</span>
<span id="chatStatus" class="text-xs" style="color:var(--muted)"></span>
</div>
<button id="globalDotsBtn" class="ml-auto p-2 rounded-full" style="color:var(--mine); opacity:0; pointer-events:none; transition:opacity 0.15s ease;"></button>
</div>

<div class="relative flex-1 min-h-0">
<div id="messagesWrapper" class="h-full p-3 overflow-y-auto bg-gray-50">
<div id="messages" class="flex flex-col gap-2"></div>
</div>

<button id="newMsgBtn" class="hidden z-10 absolute bottom-3 right-3 w-10 h-10 rounded-full bg-white shadow-lg items-center justify-center accent-text text-lg border">
↓
<span id="newMsgBadge" class="hidden absolute -top-1 -right-1 text-white text-[10px] leading-none rounded-full min-w-[18px] h-[18px] items-center justify-center px-1" style="background:var(--danger)">0</span>
</button>
</div>

<div id="replyPreview" class="hidden px-3 py-2 border-t bg-gray-50 items-center gap-2">
<div class="w-1 self-stretch rounded" style="background:var(--mine)"></div>
<div class="flex-1 min-w-0">
<div id="replyPreviewName" class="text-xs font-semibold accent-text"></div>
<div id="replyPreviewText" class="text-sm text-gray-600 truncate"></div>
</div>
<button id="replyPreviewClose" class="text-gray-400 hover:text-gray-600 px-2 text-lg leading-none">✕</button>
</div>

<div id="editPreview" class="hidden px-3 py-2 border-t items-center gap-2" style="background:#F5F4F2">
<div class="w-1 self-stretch rounded" style="background:var(--theirs)"></div>
<div class="flex-1 min-w-0">
<div class="text-xs font-semibold" style="color:var(--theirs)">Редактирование сообщения</div>
</div>
<button id="editPreviewClose" class="text-gray-400 hover:text-gray-600 px-2 text-lg leading-none">✕</button>
</div>

<div id="composerBar" class="p-2 border-t flex gap-2 items-center">
<input id="input" type="text" placeholder="Сообщение..." class="flex-1 border rounded-xl px-3 py-2">
<button id="micBtn" class="w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center text-white" style="background:var(--mine)">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
</button>
<button id="sendBtn" class="px-4 py-2 rounded-xl text-white font-semibold" style="background:var(--mine)">Отправить</button>
</div>

<div id="recordingBar" class="hidden p-2 border-t items-center gap-3">
<button id="cancelRecordBtn" class="w-9 h-9 flex-shrink-0 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100">✕</button>
<div class="flex items-center gap-2 flex-1">
<span id="recordDot" class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:var(--danger)"></span>
<span id="recordTimer" class="text-sm text-gray-500 tabular-nums">0:00</span>
</div>
<button id="sendRecordBtn" class="w-10 h-10 flex-shrink-0 rounded-full flex items-center justify-center text-white" style="background:var(--mine)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
</button>
</div>
</div>

<div id="msgMenu" class="hidden fixed inset-0 z-30">
<div id="msgMenuBackdrop" class="absolute inset-0 bg-black/10"></div>
<div id="msgMenuBox" class="absolute bg-white rounded-2xl shadow-xl overflow-hidden text-sm min-w-[180px] border border-gray-100">
<button id="menuCopy" class="w-full text-left px-4 py-3 hover:bg-gray-100 font-medium">⧉ Копировать</button>
<button id="menuEdit" class="w-full text-left px-4 py-3 hover:bg-gray-100 font-medium">✎ Редактировать</button>
<button id="menuDelete" class="w-full text-left px-4 py-3 hover:bg-gray-100 font-medium" style="color:var(--danger)">🗑 Удалить</button>
</div>
</div>

<script src="chat.js"></script>
</body>
</html>
