<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurChat — Чат</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body class="h-[100dvh] bg-gray-100 flex justify-center items-center overflow-hidden">

<div class="max-w-md w-full h-full bg-white flex flex-col">
  <div id="chatHeader" class="sticky top-0 z-10 bg-white p-3 border-b flex items-center gap-2">
    <button id="backBtn" class="text-blue-500 text-xl leading-none px-1">←</button>
    <div id="chatAvatar" class="w-9 h-9 rounded-full flex items-center justify-center text-white text-sm font-semibold flex-shrink-0"></div>
    <div class="flex flex-col leading-tight">
      <span id="chatTitle" class="text-lg font-semibold">Чат</span>
      <span id="chatStatus" class="text-xs text-gray-400"></span>
    </div>
  </div>

  <div class="relative flex-1 min-h-0">
    <div id="messagesWrapper" class="h-full p-3 overflow-y-auto bg-gray-50">
      <div id="messages" class="flex flex-col gap-2"></div>
    </div>

    <button id="newMsgBtn" class="hidden z-10 absolute bottom-3 right-3 w-10 h-10 rounded-full bg-white shadow-lg items-center justify-center text-blue-500 text-lg border">
      ↓
      <span id="newMsgBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] leading-none rounded-full min-w-[18px] h-[18px] items-center justify-center px-1">0</span>
    </button>
  </div>

  <div id="replyPreview" class="hidden px-3 py-2 border-t bg-gray-50 items-center gap-2">
    <div class="w-1 self-stretch bg-blue-500 rounded"></div>
    <div class="flex-1 min-w-0">
      <div id="replyPreviewName" class="text-xs font-semibold text-blue-600"></div>
      <div id="replyPreviewText" class="text-sm text-gray-600 truncate"></div>
    </div>
    <button id="replyPreviewClose" class="text-gray-400 hover:text-gray-600 px-2 text-lg leading-none">✕</button>
  </div>

  <div id="editPreview" class="hidden px-3 py-2 border-t bg-yellow-50 items-center gap-2">
    <div class="w-1 self-stretch bg-yellow-500 rounded"></div>
    <div class="flex-1 min-w-0">
      <div class="text-xs font-semibold text-yellow-600">Редактирование сообщения</div>
    </div>
    <button id="editPreviewClose" class="text-gray-400 hover:text-gray-600 px-2 text-lg leading-none">✕</button>
  </div>

  <div class="p-2 border-t flex gap-2">
    <input id="input" type="text" placeholder="Сообщение..." class="flex-1 border rounded-xl px-3 py-2">
    <button id="sendBtn" class="px-4 py-2 rounded-xl bg-blue-500 text-white">Отправить</button>
  </div>
</div>

<div id="msgMenu" class="hidden fixed inset-0 z-30">
  <div id="msgMenuBackdrop" class="absolute inset-0 bg-black/10"></div>
  <div id="msgMenuBox" class="absolute bg-white rounded-xl shadow-xl overflow-hidden text-sm min-w-[170px]">
    <button id="menuReply" class="w-full text-left px-4 py-3 hover:bg-gray-100">↩ Ответить</button>
    <button id="menuEdit" class="w-full text-left px-4 py-3 hover:bg-gray-100">✎ Редактировать</button>
    <button id="menuDelete" class="w-full text-left px-4 py-3 hover:bg-gray-100 text-red-500">🗑 Удалить</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
