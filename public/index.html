<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurChat — Вход / Регистрация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg: #F5F4F2;
    --dot: rgba(120,110,130,0.22);
    --mine: #4A4A52;
    --theirs: #5C5C66;
    --ink: #3A3550;
    --muted: #8E88A8;
    --card: rgba(255,255,255,0.65);
  }
  html, body { height: 100%; }
  body{
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    background-color: #FFFFFF;
  }
  .wordmark{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #232228;
  }
  .card{
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.7);
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px -22px rgba(90, 70, 140, 0.3);
  }
  .field{
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(140,120,180,0.2);
    color: var(--ink);
  }
  .field::placeholder{ color: var(--muted); }
  .field:focus{
    outline: none;
    border-color: var(--theirs);
    box-shadow: 0 0 0 3px rgba(47,167,154,0.25);
  }
  .tab-track{
    position: relative;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(140,120,180,0.18);
  }
  .tab-thumb{
    position: absolute;
    top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    background: var(--mine);
    border-radius: 9999px;
    transition: transform 0.28s cubic-bezier(.4,0,.2,1), background-color 0.28s ease;
    box-shadow: 0 4px 12px -2px rgba(74,74,82,0.5);
  }
  .tab-track.is-register .tab-thumb{
    transform: translateX(100%);
    background: var(--theirs);
    box-shadow: 0 4px 12px -2px rgba(92,92,102,0.5);
  }
  .tab-btn{ position: relative; z-index: 1; color: var(--muted); transition: color 0.2s ease; }
  .tab-btn.is-active{ color: #fff; font-weight: 600; }
  .cta{
    background: var(--mine);
    color: #FFF3EE;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px -4px rgba(74,74,82,0.4); }
  .cta.is-register{ background: var(--theirs); color:#F5F4F6; }
  .cta.is-register:hover{ box-shadow: 0 10px 22px -4px rgba(92,92,102,0.4); }
  @media (prefers-reduced-motion: reduce){
    .tab-thumb, .cta{ transition: none; }
  }
</style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center relative overflow-hidden">

  <div class="relative w-full max-w-md px-6 py-10 flex flex-col gap-8">
    <div class="text-center flex flex-col gap-2">
      <h1 class="wordmark text-4xl sm:text-5xl">OurChat</h1>
      <p class="text-sm" style="color:var(--muted)">Простой чат для своих — без лишнего</p>
    </div>

    <div class="card rounded-3xl p-6 flex flex-col gap-5">
      <div id="tabTrack" class="tab-track rounded-full p-1 flex">
        <div class="tab-thumb"></div>
        <button type="button" id="loginTab" class="tab-btn is-active flex-1 py-2.5 rounded-full text-sm">Вход</button>
        <button type="button" id="registerTab" class="tab-btn flex-1 py-2.5 rounded-full text-sm">Регистрация</button>
      </div>
      <form id="loginForm" class="flex flex-col gap-3">
        <input id="loginName" type="text" placeholder="Ник" maxlength="20" autocomplete="username" class="field rounded-xl px-4 py-3 text-sm">
        <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password" class="field rounded-xl px-4 py-3 text-sm">
        <button type="submit" class="cta rounded-xl py-3 text-sm font-semibold mt-1">Войти</button>
      </form>
      <form id="registerForm" class="flex flex-col gap-3 hidden">
        <input id="regName" type="text" placeholder="Ник" maxlength="20" autocomplete="username" class="field rounded-xl px-4 py-3 text-sm">
        <input id="regPassword" type="password" placeholder="Пароль" autocomplete="new-password" class="field rounded-xl px-4 py-3 text-sm">
        <button type="submit" class="cta is-register rounded-xl py-3 text-sm font-semibold mt-1">Зарегистрироваться</button>
      </form>
    </div>
  </div>

<script src="auth.js"></script>
</body>
</html>
