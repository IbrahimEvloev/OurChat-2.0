<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurChat — Вход / Регистрация</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-[100dvh] bg-gray-100 flex items-center justify-center">

<div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6 flex flex-col gap-4">
  <h2 class="text-2xl font-semibold text-center">OurChat</h2>

  <div class="flex justify-around">
    <button id="loginTab" class="font-semibold px-4 py-2 border-b-2 border-blue-500">Вход</button>
    <button id="registerTab" class="px-4 py-2">Регистрация</button>
  </div>

  <!-- Вход -->
  <form id="loginForm" class="flex flex-col gap-3">
    <input id="loginName" type="tel" placeholder="Номер телефона" class="border rounded-xl px-4 py-2">
    <input id="loginPassword" type="password" placeholder="Пароль" class="border rounded-xl px-4 py-2">
    <button type="submit" class="py-2 rounded-xl bg-blue-500 text-white hover:bg-blue-600">Войти</button>
  </form>

  <!-- Регистрация -->
  <form id="registerForm" class="flex flex-col gap-3 hidden">
    <input id="regName" type="tel" placeholder="Номер телефона" class="border rounded-xl px-4 py-2">
    <input id="regPassword" type="password" placeholder="Пароль" class="border rounded-xl px-4 py-2">
    <button type="submit" class="py-2 rounded-xl bg-green-500 text-white hover:bg-green-600">Зарегистрироваться</button>
  </form>
</div>

<script src="auth.js"></script>
</body>
</html>
